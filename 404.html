<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0D2B45">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Siden finnes ikke — Solwirk</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=Manrope:wght@700;800&display=swap");
*{box-sizing:border-box}
html,body{margin:0;background:#E8F1F8;color:#0D2B45}
body{font-family:"IBM Plex Sans",sans-serif;line-height:1.55;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem 1.25rem}
main{width:100%;max-width:36rem}
.brand{font-family:"Manrope",sans-serif;font-size:1.4rem;font-weight:800;margin:0;color:#0D2B45;text-decoration:none}
.brand::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:#FFC233;margin-right:8px}
.rubro{margin:.15rem 0 0;color:#5A6B7B;font-size:.95rem}
.code{font-family:"Manrope",sans-serif;font-size:clamp(4.5rem,18vw,7rem);line-height:1;font-weight:800;color:#FFC233;margin:2rem 0 .5rem}
h1{font-family:"Manrope",sans-serif;font-weight:800;margin:0 0 .5rem;font-size:1.8rem}
p{margin:0 0 1rem;color:#5A6B7B}
.actions{margin-top:1.75rem;display:flex;flex-wrap:wrap;gap:.75rem 1.25rem}
.btn{display:inline-block;background:#FFC233;color:#0D2B45;text-decoration:none;padding:.8rem 1.4rem;border-radius:10px;font-weight:700;font-family:"Manrope",sans-serif}
.actions a:not(.btn){color:#0D2B45}
</style>
</head>
<body>
<main>
<a class="brand" href="/">Solwirk</a>
<p class="rubro">Strøm til hytta</p>
<div class="code" aria-hidden="true">404</div>
<h1>Siden finnes ikke</h1>
<p>Vi finner ikke denne siden. Den kan være flyttet, eller adressen kan være skrevet feil.</p>
<div class="actions">
  <a class="btn" href="/">Til forsiden</a>
  <a href="/kontakt">Kontakt oss</a>
</div>
</main>
</body>
</html>
